[package]
name = "eos-notes"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "E-OS Notes — Crimson-themed notes app (Slint UI, SQLite/WAL storage)"
repository = "https://gitlab.com/e-os/eos-notes"
build = "build.rs"

[[bin]]
name = "eos-notes"
path = "src/main.rs"

[dependencies]
# The GUI uses Slint for the widgets; the Redox backend (software renderer over
# orbclient) + font bootstrap live in the shared eos-ui crate.
slint = { version = "1.17", default-features = false, features = ["compat-1-0", "std", "renderer-software"], optional = true }
eos-ui = { git = "https://github.com/Gh0s777tt/eos-ui.git", rev = "c53180d40e5b91f15c848c4c39b1a307b14831a1", optional = true }
rusqlite = { version = "0.31", features = ["bundled"] }

# Host window backend. Two facts decide the shape of this section:
#   1. cargo refuses the same crate under two names in one package
#      ("depends on crate `slint` v1.17.1 multiple times with different names"),
#      so the host backend cannot be a renamed second `slint` entry;
#   2. a feature that switched `slint/backend-winit` on would switch it on for
#      *every* target, Redox included — and modern winit has no Redox backend.
# Depending on the backend crate itself, target-scoped and optional, gives both
# properties: Redox never resolves this section, and a host build only pulls
# winit in when it is asked to.
[target.'cfg(not(target_os = "redox"))'.dependencies]
i-slint-backend-winit = { version = "1.17", default-features = false, features = ["renderer-software"], optional = true }

# Windows needs the implicit `muda` feature ON, and the reason is a bug, not a
# preference. In i-slint-backend-winit 1.17.1 the `WinitWindowOrNone::HasWindow`
# variant declares its `muda_adapter` field under `#[cfg(muda)]` (build.rs:
# `muda = all(feature = "muda", any(windows, macos))`) while the pattern match at
# winitwindowadapter.rs:913 is gated only `#[cfg(target_os = "windows")]`. `muda`
# is an IMPLICIT feature — an optional dependency, absent from [features] — so it
# is off by default and the crate cannot compile for Windows at all. Measured
# here: without it the build stops on E0026, with it the .exe links.
[target.'cfg(target_os = "windows")'.dependencies]
i-slint-backend-winit = { version = "1.17", default-features = false, features = ["renderer-software", "muda"], optional = true }

# Linux/BSD hosts additionally need the display-server features; macOS does not.
# [UNVERIFIED]: the cross-build was measured, running the binary on a Linux box
# was not — no Linux host was available.
[target.'cfg(all(unix, not(target_os = "redox"), not(target_os = "macos")))'.dependencies]
i-slint-backend-winit = { version = "1.17", default-features = false, features = ["renderer-software", "x11", "wayland"], optional = true }

# Linux, second half: dlopen fontconfig instead of linking it. Without this the
# cross build dies in yeslogic-fontconfig-sys' build.rs with "pkg-config has not
# been configured to support cross-compilation", because pkg-config cannot
# answer for a target sysroot that is not there. `i-slint-common` is pulled in
# as a DIRECT dependency purely so that cargo's feature unification applies
# `fontconfig-dlopen` to the copy the rest of the graph already uses.
[target.'cfg(target_os = "linux")'.dependencies]
i-slint-common = { version = "=1.17.1", default-features = false, features = ["fontconfig-dlopen"], optional = true }

[features]
# `gui` stays the default: the Redox image build (recipes/gui/eos-notes) takes
# the tree as-is and expects the widgets.
#
# `host-backend` is the explicit escape that makes the binary usable OFF Redox.
# It is not the default, and that is deliberate — a Redox cross build must not
# be able to pick a winit backend up by accident, and a CI container that only
# runs --selftest must not need display libraries to link.
default = ["gui"]
gui = ["dep:slint", "dep:eos-ui"]
host-backend = ["gui", "dep:i-slint-backend-winit", "dep:i-slint-common"]

[build-dependencies]
slint-build = "1.17"

[profile.release]
# E-OS hardening baseline (matches the code forks): any unintended integer
# overflow aborts instead of wrapping silently.
overflow-checks = true
